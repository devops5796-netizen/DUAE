name: Scrape Agency Phone Numbers

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        include:
        - start: 120
          end: 135
        - start: 135
          end: 150
        - start: 150
          end: 165
        - start: 165
          end: 180
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libdbus-glib-1-2

      - name: Install Camoufox
        run: |
          python -m camoufox fetch

      - name: Run scraper
        run: |
          python scraper.py \
            --start ${{ matrix.start }} \
            --end ${{ matrix.end }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: agencies-${{ matrix.start }}-${{ matrix.end }}
          path: |
            agencies_checkpoint.xlsx
            agencies_with_phone_${{ matrix.start }}_${{ matrix.end }}.csv
  merge:
    needs: scrape
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas openpyxl

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: outputs

      - name: Merge csv files
        run: python merge.py

      - name: Upload merged file
        uses: actions/upload-artifact@v4
        with:
          name: merged-output
          path: agencies_with_phone_all.csv
