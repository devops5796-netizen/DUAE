# ── PER-SCRAPER SCHEMAS ──────────────────────────────────────
excel_schema:

  # ── BATCH Motors ─────────────────────────────────────────────────

  - scraper: used_cars (motors)
    excel_file_pattern: "{brand_name}.xlsx"
    sheets:
      - name: "{car_type}"
        required_columns: *col_sale_cars_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: new_cars (motors)
    excel_file_pattern: "{brand_name}.xlsx"
    sheets:
      - name: "{car_type}"
        required_columns: *col_sale_cars_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: export_cars (motors)
    excel_file_pattern: "{brand_name}.xlsx"
    sheets:
      - name: "{car_type}"
        required_columns: *col_sale_cars_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: rental_cars (motors)
    excel_file_pattern: "{brand_name}.xlsx"
    sheets:
      - name: "{car_type}"
        required_columns: *col_renal_cars_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: motorcycles (motors)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
      - name: "{child_category or Main}"
        required_columns: *col_motorcycles_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: auto_accessories_parts (motors)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
      - name: "{child_category or Main}"
        required_columns: *col_boats_and_auto_accessories_parts_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: heavy_vehicles (motors)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
      - name: "{child_category or Main}"
        required_columns: *col_heavy_vehicles_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: boats (motors)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
      - name: "{child_category or Main}"
        required_columns: *col_boats_and_auto_accessories_parts_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: number_plates (motors)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
      - name: "{child_category or Main}"
        required_columns: *col_number_plates_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5
  
  # ── BATCH Sale Property ─────────────────────────────────────────────────
  - scraper: sale_commercial (property)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
      - name: "{child_category or Main}"
        required_columns: *col_sale_commercial
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: sale_land (property)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
      - name: "{child_category or Main}"
        required_columns: *col_sale_land
        row_count_range: [1, 600]
    min_file_size_kb: 5

  # ── BATCH Sale Property2 ─────────────────────────────────────────────────
  - scraper: sale_residential (property)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
      - name: "{child_category or Main}"
        required_columns: *col_sale_residential
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: sale_multiple_units (property)
    excel_file_pattern: "{subcategory_slug}.xlsx"
    sheets:
