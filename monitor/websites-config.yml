# ------------------------------------------------------------
# PIPELINE CHAIN (auto-detected from workflow triggers)
# Batch Motors → Property Rent → Property Sale → Jobs → Classifieds & Community   (daily at 00:00 UTC)
# ------------------------------------------------------------
pipeline_chain:
  - batch: "Motors"
    trigger: "cron: '0 0 * * *'"
    triggers_next: "Sale Property"

  - batch: "Rent Property"
    trigger: "cron: '0 0 * * *'"
    triggers_next: "Jobs"
  - batch: "Jobs"
    trigger: "on_completion: Rent Property"
    triggers_next: null

  - batch: "Classifieds & Community"
    trigger: "cron: '0 0 * * *'"
    triggers_next: null
  
  - batch: "Sale Property"
    trigger: "cron: '0 0 * * *'"
    triggers_next: "Sale Property2"
  - batch: "Sale Property2"
    trigger: "on_completion: Sale Property"
    triggers_next: null

  - batch: "Rent Property2"
    trigger: "cron: '0 0 * * *'"
    triggers_next: null

